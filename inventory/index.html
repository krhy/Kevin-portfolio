<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Inventory & Sales Tracker</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600;700&display=swap');

  :root {
    --paper: #F7F5F0;
    --surface: rgba(255,255,255,0.78);
    --surface-solid: #FFFFFF;
    --border: rgba(79,114,89,0.14);
    --border-strong: rgba(79,114,89,0.30);
    --teal: #4F7259;
    --teal-deep: #37503F;
    --teal-wash: rgba(79,114,89,0.07);
    --brown: #C98A2D;
    --brown-deep: #8C5A28;
    --brown-wash: rgba(140,90,40,0.08);
    --rust: #C4442A;
    --ink: #23223A;
    --muted: #6E6C7E;
    --header-1: #223228;
    --header-2: #4F7259;
    --on-teal: rgba(255,255,255,0.9);
    --on-teal-muted: rgba(255,255,255,0.58);
    --on-teal-border: rgba(255,255,255,0.18);
    --amber-on-teal: #E7B26B;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: 'Inter', sans-serif; color: var(--ink); min-height: 100vh;
    background:
      radial-gradient(circle at 15% -10%, var(--teal-wash), transparent 40%),
      radial-gradient(circle at 100% 0%, var(--brown-wash), transparent 35%),
      var(--paper);
  }
  button { font-family: inherit; cursor: pointer; }
  input:focus, select:focus { outline: 2px solid var(--teal); outline-offset: 1px; }

  @keyframes pulseDot { 0%,100% { box-shadow: 0 0 0 0 rgba(231,178,124,0.45); } 50% { box-shadow: 0 0 0 6px rgba(231,178,124,0); } }
  @keyframes fadeSlideIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  .header {
    padding: 24px 20px 26px; position: relative;
    background: linear-gradient(160deg, var(--header-1), var(--header-2));
    border-radius: 0 0 24px 24px;
    box-shadow: 0 10px 24px rgba(23,66,63,0.22);
  }
  .brand { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .brand-text { font-family: 'Space Grotesk', sans-serif; font-size: 12.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--on-teal-muted); font-weight: 600; }
  .live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--amber-on-teal); animation: pulseDot 2s ease-in-out infinite; margin-left: auto; }
  .live-label { font-family: 'Space Grotesk', sans-serif; font-size: 10.5px; letter-spacing: 0.12em; color: var(--amber-on-teal); margin-left: 6px; font-weight: 600; }

  .header-top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .balance-label { font-family: 'Space Grotesk', sans-serif; font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--on-teal-muted); font-weight: 600; }
  .auth-btn {
    background: rgba(255,255,255,0.15); border: 1px solid var(--on-teal-border); color: var(--on-teal);
    padding: 5px 12px; border-radius: 999px; font-size: 11px; font-family: 'Space Grotesk', sans-serif;
    font-weight: 600; cursor: pointer; transition: background 0.2s;
  }
  .auth-btn.unlocked { background: rgba(231,178,124,0.3); border-color: var(--amber-on-teal); color: var(--amber-on-teal); }

  .balance { font-family: 'IBM Plex Mono', monospace; font-weight: 700; font-size: 36px; line-height: 1; color: var(--amber-on-teal); }

  .stats { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 14px; }
  .stat-value { font-family: 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 600; color: var(--on-teal); }
  .stat-label { font-size: 9.5px; color: var(--on-teal-muted); text-transform: uppercase; letter-spacing: 0.08em; }

  .panel { padding: 22px 16px 110px; max-width: 900px; margin: 0 auto; }
  .panel-title { font-family: 'Space Grotesk', sans-serif; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; font-weight: 600; }
  
  .controls { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .controls input[type="text"] { flex: 1 1 200px; padding: 8px 12px; font-size: 13.5px; border-radius: 10px; border: 1px solid var(--border-strong); background: #fff;}
  .controls select { padding: 8px 10px; font-size: 13px; border-radius: 10px; border: 1px solid var(--border-strong); background: #fff;}

  .tile-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 12px; }
  .item-card {
    background: var(--surface); backdrop-filter: blur(10px);
    border: 1px solid var(--border); border-left: 3px solid var(--teal);
    border-radius: 12px; padding: 12px 14px; animation: fadeSlideIn 0.3s ease both;
  }
  .item-card.low-stock { border-left-color: var(--rust); }
  .item-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 6px; }
  .item-name { font-weight: 600; font-size: 14.5px; color: var(--ink); }
  .item-qty { font-family: 'IBM Plex Mono', monospace; font-weight: 700; font-size: 14px; color: var(--teal); background: var(--teal-wash); padding: 2px 6px; border-radius: 6px; }
  
  .financial-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin: 8px 0; background: rgba(0,0,0,0.02); padding: 8px; border-radius: 8px; font-size: 12px; }
  .fin-label { color: var(--muted); font-size: 10px; text-transform: uppercase; }
  .fin-val { font-family: 'IBM Plex Mono', monospace; font-weight: 600; color: var(--ink); }
  .fin-val.profit { color: #2E7D32; }

  .item-meta { font-size: 11.5px; color: var(--muted); margin-bottom: 2px; }
  .item-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; padding-top: 6px; border-top: 1px solid var(--border); }
  .action-group { display: flex; gap: 10px; }
  .link-btn { background: none; border: none; font-size: 12px; cursor: pointer; color: var(--muted); padding: 0; }
  .link-btn.danger { color: var(--rust); }
  .link-btn.sell { color: var(--brown); font-weight: 600; }

  .fab { position: fixed; bottom: 20px; left: 0; right: 0; display: flex; justify-content: center; z-index: 5; }
  .fab-primary {
    display: flex; align-items: center; gap: 6px; background: var(--brown); color: #fff;
    border: none; border-radius: 999px; padding: 13px 24px; font-weight: 700; font-size: 14.5px;
    font-family: 'Space Grotesk', sans-serif; box-shadow: 0 4px 16px rgba(180,118,59,0.28);
  }

  .overlay { position: fixed; inset: 0; background: rgba(36,29,22,0.35); backdrop-filter: blur(2px); display: none; align-items: flex-end; z-index: 10; }
  .overlay.open { display: flex; }
  .sheet {
    background: var(--surface-solid); color: var(--ink); width: 100%; border-radius: 22px 22px 0 0;
    padding: 10px 18px 24px; max-height: 88vh; overflow-y: auto; border-top: 1px solid var(--border-strong);
  }
  .drag-handle { width: 36px; height: 4px; border-radius: 999px; background: var(--border-strong); margin: 4px auto 14px; }
  .sheet-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .sheet-title { font-family: 'Space Grotesk', sans-serif; font-size: 16px; text-transform: uppercase; color: var(--teal); font-weight: 700; }
  .close-btn { background: none; border: none; color: var(--muted); font-size: 16px; }

  form { display: flex; flex-direction: column; gap: 12px; }
  label.field { display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; color: var(--muted); }
  input[type="text"], input[type="number"], select {
    padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border-strong); font-size: 15px; background: #fff; width: 100%;
  }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .form-error { color: var(--rust); font-size: 13px; font-weight: 600; }
  .status-banner { position: fixed; top: 14px; right: 14px; font-size: 11px; font-family: 'Space Grotesk', sans-serif; font-weight: 600; transition: opacity 0.3s; z-index: 20; background: rgba(0,0,0,0.22); color: #E7B26B; padding: 4px 10px; border-radius: 999px; }
</style>
</head>
<body>

<div class="header">
  <div class="brand">
    <span class="brand-text">Inventory & Sales Intelligence</span>
    <div class="live-dot"></div><span class="live-label">LIVE</span>
  </div>

  <div class="header-top-row">
    <div class="balance-label" style="margin-bottom:0;">Total Net Profit</div>
    <button class="auth-btn" id="authBtn" onclick="toggleAuth()">🔒 Unlock Editing</button>
  </div>
  <div id="totalProfitDisplay" class="balance">$0.00</div>

  <div class="stats">
    <div><div id="statRevenue" class="stat-value">$0.00</div><div class="stat-label">Total Revenue</div></div>
    <div><div id="statUnitsSold" class="stat-value">0</div><div class="stat-label">Units Sold</div></div>
    <div><div id="statStock" class="stat-value">0</div><div class="stat-label">In Stock</div></div>
  </div>
</div>

<div class="panel">
  <div class="panel-title">Stock & Products</div>
  <div class="controls">
    <input type="text" id="searchInput" placeholder="Search products..." oninput="setSearch(this.value)" />
    <select id="categoryFilter" onchange="setCategoryFilter(this.value)">
      <option value="all">All Categories</option>
    </select>
  </div>
  <div class="tile-grid" id="inventoryGrid"></div>
</div>

<div class="fab" id="fabRow" style="display:none;">
  <button class="fab-primary" onclick="openForm()">+ Add Product</button>
</div>

<div class="overlay" id="overlay" onclick="if(event.target===this) closeForm()">
  <div class="sheet">
    <div class="drag-handle"></div>
    <div class="sheet-head">
      <div class="sheet-title" id="sheetTitle">New Product</div>
      <button class="close-btn" onclick="closeForm()">✕</button>
    </div>
    <form id="itemForm" onsubmit="submitForm(event)">
      <div id="formFields"></div>
      <div class="form-error" id="formError"></div>
      <button type="submit" class="fab-primary" style="width:100%; justify-content:center; margin-top:8px;">Save Product</button>
    </form>
  </div>
</div>

<div class="status-banner" id="statusBanner" style="opacity:0">Saving…</div>

<script>
const API_URL = '/api/inventory/items';
let items = [];
let isAuthorized = false; // Starts locked as read-only
let searchQuery = '';
let categoryFilter = 'all';
let editingId = null;
let confirmDeleteId = null;

function fmt(num) {
  return '$' + (parseFloat(num) || 0).toFixed(2);
}

function toggleAuth() {
  if (isAuthorized) {
    if (confirm("Lock inventory editing back to read-only?")) {
      isAuthorized = false;
      closeForm();
      render();
      showStatus("Locked to read-only view");
    }
  } else {
    const pwd = prompt("Enter password to unlock inventory editing:");
    if (pwd === "inventory123") { // <-- Change password here if needed
      isAuthorized = true;
      render();
      showStatus("Editing mode unlocked!");
    } else if (pwd !== null) {
      alert("Incorrect password.");
    }
  }
}

async function loadData() {
  try {
    const res = await fetch(API_URL);
    if (res.ok) items = await res.json();
  } catch (e) {
    console.error("Could not load inventory", e);
  }
  render();
}

async function saveData() {
  if (!isAuthorized) return;
  showStatus('Saving…');
  try {
    await fetch(API_URL, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(items)
    });
    hideStatus();
  } catch (e) {
    showStatus('Save failed', true);
  }
}

function showStatus(text, isError) {
  const el = document.getElementById('statusBanner');
  el.textContent = text;
  el.style.opacity = '1';
}
function hideStatus() {
  setTimeout(() => { document.getElementById('statusBanner').style.opacity = '0'; }, 600);
}

function setSearch(val) { searchQuery = val; render(); }
function setCategoryFilter(val) { categoryFilter = val; render(); }

// Quick record sale function when unlocked
function recordSale(id) {
  if (!isAuthorized) return;
  items = items.map(i => {
    if (i.id === id) {
      if (i.quantity <= 0) {
        alert("Cannot sell: Item is out of stock!");
        return i;
      }
      return {
        ...i,
        quantity: i.quantity - 1,
        unitsSold: (i.unitsSold || 0) + 1
      };
    }
    return i;
  });
  render();
  saveData();
}

function render() {
  const authBtn = document.getElementById('authBtn');
  authBtn.textContent = isAuthorized ? '🔓 Unlocked (Lock)' : '🔒 Unlock Editing';
  authBtn.className = 'auth-btn' + (isAuthorized ? ' unlocked' : '');
  
  document.getElementById('fabRow').style.display = isAuthorized ? 'flex' : 'none';

  const cats = [...new Set(items.map(i => i.category || 'General'))].sort();
  const catSelect = document.getElementById('categoryFilter');
  catSelect.innerHTML = `<option value="all">All Categories</option>` + 
    cats.map(c => `<option value="${c}" ${categoryFilter === c ? 'selected' : ''}>${c}</option>`).join('');

  const filtered = items.filter(item => {
    if (categoryFilter !== 'all' && (item.category || 'General') !== categoryFilter) return false;
    if (!searchQuery) return true;
    const q = searchQuery.toLowerCase();
    return (item.name || '').toLowerCase().includes(q) || (item.location || '').toLowerCase().includes(q);
  });

  // Calculations
  let totalRev = 0;
  let totalProfit = 0;
  let totalStockCount = 0;
  let totalSoldUnits = 0;

  items.forEach(i => {
    const qty = parseInt(i.quantity) || 0;
    const sold = parseInt(i.unitsSold) || 0;
    const cost = parseFloat(i.costPrice) || 0;
    const price = parseFloat(i.sellingPrice) || 0;

    totalStockCount += qty;
    totalSoldUnits += sold;
    totalRev += sold * price;
    totalProfit += sold * (price - cost);
  });

  document.getElementById('totalProfitDisplay').textContent = fmt(totalProfit);
  document.getElementById('statRevenue').textContent = fmt(totalRev);
  document.getElementById('statUnitsSold').textContent = totalSoldUnits;
  document.getElementById('statStock').textContent = totalStockCount;

  const grid = document.getElementById('inventoryGrid');
  if (filtered.length === 0) {
    grid.innerHTML = `<div style="grid-column: 1/-1; text-align:center; padding: 30px; color:var(--muted);">No products found.</div>`;
    return;
  }

  grid.innerHTML = filtered.map((item, idx) => {
    const qty = parseInt(item.quantity) || 0;
    const sold = parseInt(item.unitsSold) || 0;
    const cost = parseFloat(item.costPrice) || 0;
    const price = parseFloat(item.sellingPrice) || 0;
    const itemProfitPerUnit = price - cost;
    const min = parseInt(item.minThreshold) || 2;
    const isLow = qty <= min;

    let actions = '';
    if (isAuthorized) {
      const confirming = confirmDeleteId === item.id;
      actions = confirming
        ? `<div class="item-actions"><button class="link-btn danger" onclick="doDelete('${item.id}')">Confirm delete</button><button class="link-btn" onclick="cancelDelete()">Cancel</button></div>`
        : `<div class="item-actions">
             <div class="action-group">
               <button class="link-btn sell" onclick="recordSale('${item.id}')">🛒 Record Sale (-1)</button>
             </div>
             <div class="action-group">
               <button class="link-btn" onclick="openEdit('${item.id}')">✎ Edit</button>
               <button class="link-btn danger" onclick="askDelete('${item.id}')">🗑</button>
             </div>
           </div>`;
    }

    return `
      <div class="item-card ${isLow ? 'low-stock' : ''}" style="animation-delay:${idx * 30}ms">
        <div class="item-top">
          <span class="item-name">${escapeHtml(item.name)}</span>
          <span class="item-qty">Stock: ${qty}</span>
        </div>
        <div class="item-meta">Category: <strong>${escapeHtml(item.category || 'General')}</strong></div>
        
        <div class="financial-grid">
          <div>
            <div class="fin-label">Cost Price</div>
            <div class="fin-val">${fmt(cost)}</div>
          </div>
          <div>
            <div class="fin-label">Selling Price</div>
            <div class="fin-val">${fmt(price)}</div>
          </div>
          <div>
            <div class="fin-label">Units Sold</div>
            <div class="fin-val">${sold}</div>
          </div>
          <div>
            <div class="fin-label">Profit / Unit</div>
            <div class="fin-val profit">+${fmt(itemProfitPerUnit)}</div>
          </div>
        </div>

        ${isLow ? `<div class="item-meta" style="color:var(--rust); font-weight:600;">⚠ Low Stock Alert (${qty} left)</div>` : ''}
        ${actions}
      </div>`;
  }).join('');
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str || '';
  return d.innerHTML;
}

function openForm() {
  if (!isAuthorized) return;
  editingId = null;
  document.getElementById('sheetTitle').textContent = 'Add New Product';
  document.getElementById('formError').textContent = '';
  document.getElementById('formFields').innerHTML = `
    <label class="field">Product Name<input type="text" id="fName" placeholder="e.g. Premium T-Shirt" required /></label>
    <label class="field">Category<input type="text" id="fCategory" placeholder="e.g. Apparel" /></label>
    <div class="form-row">
      <label class="field">Cost Price ($)<input type="number" id="fCost" step="0.01" min="0" value="0.00" required /></label>
      <label class="field">Selling Price ($)<input type="number" id="fPrice" step="0.01" min="0" value="0.00" required /></label>
    </div>
    <div class="form-row">
      <label class="field">Initial Stock<input type="number" id="fQty" min="0" value="10" required /></label>
      <label class="field">Low Stock Alert Min<input type="number" id="fMin" min="0" value="2" /></label>
    </div>
    <label class="field">Units Already Sold (Optional)<input type="number" id="fSold" min="0" value="0" /></label>
    <label class="field">Storage Location<input type="text" id="fLocation" placeholder="e.g. Shelf B3" /></label>
  `;
  document.getElementById('overlay').classList.add('open');
}

function openEdit(id) {
  if (!isAuthorized) return;
  const item = items.find(i => i.id === id);
  if (!item) return;
  editingId = id;
  document.getElementById('sheetTitle').textContent = 'Edit Product & Financials';
  document.getElementById('formError').textContent = '';
  document.getElementById('formFields').innerHTML = `
    <label class="field">Product Name<input type="text" id="fName" value="${escapeHtml(item.name)}" required /></label>
    <label class="field">Category<input type="text" id="fCategory" value="${escapeHtml(item.category || '')}" /></label>
    <div class="form-row">
      <label class="field">Cost Price ($)<input type="number" id="fCost" step="0.01" min="0" value="${item.costPrice || 0}" required /></label>
      <label class="field">Selling Price ($)<input type="number" id="fPrice" step="0.01" min="0" value="${item.sellingPrice || 0}" required /></label>
    </div>
    <div class="form-row">
      <label class="field">Current Stock<input type="number" id="fQty" min="0" value="${item.quantity}" required /></label>
      <label class="field">Low Stock Alert Min<input type="number" id="fMin" min="0" value="${item.minThreshold || 2}" /></label>
    </div>
    <label class="field">Units Sold<input type="number" id="fSold" min="0" value="${item.unitsSold || 0}" /></label>
    <label class="field">Storage Location<input type="text" id="fLocation" value="${escapeHtml(item.location || '')}" /></label>
  `;
  document.getElementById('overlay').classList.add('open');
}

function closeForm() { document.getElementById('overlay').classList.remove('open'); }

function submitForm(e) {
  e.preventDefault();
  if (!isAuthorized) return;

  const name = document.getElementById('fName').value.trim();
  const quantity = parseInt(document.getElementById('fQty').value, 10);
  const costPrice = parseFloat(document.getElementById('fCost').value);
  const sellingPrice = parseFloat(document.getElementById('fPrice').value);
  const unitsSold = parseInt(document.getElementById('fSold').value, 10) || 0;

  if (!name || isNaN(quantity) || isNaN(costPrice) || isNaN(sellingPrice)) {
    document.getElementById('formError').textContent = 'Please fill out all required numeric fields properly.';
    return;
  }

  const existing = editingId ? items.find(i => i.id === editingId) : null;

  const payload = {
    id: editingId || (Date.now().toString(36) + Math.random().toString(36).slice(2, 5)),
    name,
    category: document.getElementById('fCategory').value.trim() || 'General',
    quantity,
    costPrice,
    sellingPrice,
    unitsSold,
    minThreshold: parseInt(document.getElementById('fMin').value, 10) || 2,
    location: document.getElementById('fLocation').value.trim(),
    updatedAt: Date.now()
  };

  if (editingId) {
    items = items.map(i => i.id === editingId ? payload : i);
  } else {
    items.push(payload);
  }

  closeForm();
  render();
  saveData();
}

function askDelete(id) { if (!isAuthorized) return; confirmDeleteId = id; render(); }
function cancelDelete() { confirmDeleteId = null; render(); }
function doDelete(id) {
  if (!isAuthorized) return;
  items = items.filter(i => i.id !== id);
  confirmDeleteId = null;
  render();
  saveData();
}

loadData();
</script>
</body>
</html>
