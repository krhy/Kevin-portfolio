<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory & Sales Intelligence</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #131b2e;
      --card-border: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0ea5e9;
      --accent: #f43f5e;
      --success: #10b981;
      --warning: #f59e0b;
      --teal: #14b8a6;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 16px; min-height: 100vh; }
    
    .container { max-width: 900px; margin: 0 auto; padding-bottom: 80px; }
    
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--card-border); padding-bottom: 12px; }
    h1 { font-size: 1.25rem; font-weight: 700; color: var(--primary); display: flex; align-items: center; gap: 8px; }
    
    .auth-badge { font-size: 0.75rem; padding: 4px 10px; border-radius: 20px; font-weight: 600; cursor: pointer; border: 1px solid var(--card-border); background: var(--card-bg); color: var(--text-muted); transition: 0.2s; }
    .auth-badge.active { background: rgba(16, 185, 129, 0.15); color: var(--success); border-color: rgba(16, 185, 129, 0.3); }

    /* Stats Overview */
    .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 20px; }
    @media(min-width: 600px) { .stats-grid { grid-template-columns: repeat(4, 1fr); } }
    .stat-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 10px; padding: 12px; }
    .stat-label { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 4px; }
    .stat-val { font-size: 1.1rem; font-weight: 700; }

    /* Controls Bar */
    .controls { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    .search-input { flex: 1; min-width: 200px; background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text); padding: 10px 14px; border-radius: 8px; font-size: 0.9rem; outline: none; }
    .search-input:focus { border-color: var(--primary); }
    
    .btn { background: var(--primary); color: #000; border: none; font-weight: 600; padding: 10px 16px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; display: inline-flex; align-items: center; gap: 6px; transition: 0.2s; }
    .btn:hover { background: var(--primary-hover); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Item Card List */
    .item-list { display: flex; flex-direction: column; gap: 12px; }
    .item-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 16px; position: relative; }
    .item-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
    .item-title { font-size: 1rem; font-weight: 700; }
    .item-sku { font-size: 0.75rem; color: var(--text-muted); }
    
    .financial-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 8px; margin-bottom: 12px; }
    @media(min-width: 500px) { .financial-grid { grid-template-columns: repeat(4, 1fr); } }
    .fin-label { font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .fin-val { font-size: 0.9rem; font-weight: 700; }

    .action-group { display: flex; gap: 8px; flex-wrap: wrap; }
    .link-btn { background: transparent; border: 1px solid var(--card-border); color: var(--text); padding: 6px 12px; border-radius: 6px; font-size: 0.8rem; cursor: pointer; font-weight: 500; transition: 0.2s; display: inline-flex; align-items: center; gap: 4px; }
    .link-btn:hover { background: rgba(255,255,255,0.05); border-color: var(--text-muted); }
    .link-btn.sell { color: var(--success); border-color: rgba(16, 185, 129, 0.3); }
    .link-btn.restock { color: var(--primary); border-color: rgba(56, 189, 248, 0.3); }
    .link-btn.expense { color: var(--teal); border-color: rgba(20, 184, 166, 0.3); }
    .link-btn.delete { color: var(--danger); border-color: rgba(239, 68, 68, 0.3); margin-left: auto; }

    /* Overlays / Modals */
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); display: flex; justify-content: center; align-items: flex-end; opacity: 0; pointer-events: none; transition: 0.25s; z-index: 100; }
    .overlay.open { opacity: 1; pointer-events: auto; }
    @media(min-width: 600px) { .overlay { align-items: center; } }

    .sheet { background: var(--card-bg); border: 1px solid var(--card-border); width: 100%; max-width: 500px; border-top-left-radius: 16px; border-top-right-radius: 16px; padding: 20px; max-height: 90vh; overflow-y: auto; transform: translateY(100%); transition: 0.25s; }
    @media(min-width: 600px) { .sheet { border-radius: 16px; transform: translateY(20px); } }
    .overlay.open .sheet { transform: translateY(0); }

    .sheet-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .sheet-title { font-size: 1rem; font-weight: 700; }
    .close-btn { background: none; border: none; color: var(--text-muted); font-size: 1.2rem; cursor: pointer; }

    .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; font-size: 0.85rem; color: var(--text-muted); }
    .field input, .field textarea { background: var(--bg); border: 1px solid var(--card-border); color: var(--text); padding: 10px; border-radius: 8px; font-size: 0.9rem; outline: none; width: 100%; }
    .field input:focus, .field textarea:focus { border-color: var(--primary); }

    .form-error { color: var(--danger); font-size: 0.75rem; margin-bottom: 10px; }
    
    /* Empty state */
    .empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); font-size: 0.9rem; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>📦 Inventory & Sales</h1>
      <div id="authBadge" class="auth-badge" onclick="toggleAuth()">🔒 Locked (Read-Only)</div>
    </header>

    <!-- Top Statistics Grid -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Total Capital Invested</div>
        <div class="stat-val" id="statTotalCapital">₱0.00</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total Sales Revenue</div>
        <div class="stat-val" id="statTotalSales" style="color:var(--success);">₱0.00</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Estimated Net Profit</div>
        <div class="stat-val" id="statNetProfit" style="color:var(--primary);">₱0.00</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Additional Fees Paid</div>
        <div class="stat-val" id="statTotalFees" style="color:var(--teal);">₱0.00</div>
      </div>
    </div>

    <!-- Controls Toolbar -->
    <div class="controls">
      <input type="text" id="searchInput" class="search-input" placeholder="Search products..." oninput="render()" />
      <button class="btn" id="addItemBtn" onclick="openItemForm()" disabled style="opacity:0.5;">+ Add Product</button>
    </div>

    <!-- Inventory Item List -->
    <div id="itemList" class="item-list">
      <div class="empty-state">Loading inventory data...</div>
    </div>
  </div>

  <!-- Add/Edit Product Overlay -->
  <div class="overlay" id="itemOverlay" onclick="if(event.target===this) closeItemForm()">
    <div class="sheet">
      <div class="sheet-head">
        <div class="sheet-title" id="itemSheetTitle">Add New Product</div>
        <button class="close-btn" onclick="closeItemForm()">✕</button>
      </div>
      <form id="itemForm" onsubmit="submitItemForm(event)">
        <input type="hidden" id="editItemId" />
        <label class="field">Product Name
          <input type="text" id="itemName" placeholder="e.g. Wireless Mouse" required />
        </label>
        <label class="field">SKU / Code
          <input type="text" id="itemSku" placeholder="e.g. WM-001" />
        </label>
        <label class="field">Initial Quantity
          <input type="number" id="itemQty" min="0" value="1" required />
        </label>
        <label class="field">Base Unit Cost Price (₱)
          <input type="number" id="itemCost" step="0.01" min="0" placeholder="0.00" required />
        </label>
        <label class="field">Target Selling Price / Unit (₱)
          <input type="number" id="itemPrice" step="0.01" min="0" placeholder="0.00" required />
        </label>
        <label class="field">Total Add. Manpower/Shipping Fees (₱)
          <input type="number" id="itemAddFees" step="0.01" min="0" value="0" placeholder="0.00" />
        </label>
        <div class="form-error" id="itemFormError"></div>
        <button type="submit" class="btn" style="width:100%; justify-content:center;">Save Product</button>
      </form>
    </div>
  </div>

  <!-- Restock Overlay -->
  <div class="overlay" id="restockOverlay" onclick="if(event.target===this) closeRestockForm()">
    <div class="sheet">
      <div class="sheet-head">
        <div class="sheet-title" id="restockSheetTitle">Restock Product</div>
        <button class="close-btn" onclick="closeRestockForm()">✕</button>
      </div>
      <form id="restockForm" onsubmit="submitRestock(event)">
        <input type="hidden" id="restockItemId" />
        <label class="field">Quantity to Add
          <input type="number" id="restockQty" min="1" value="1" required />
        </label>
        <label class="field">New Purchase Cost for These Units (Total ₱)
          <input type="number" id="restockCost" step="0.01" min="0" placeholder="0.00" required />
        </label>
        <label class="field">Additional Fees for this Restock (₱)
          <input type="number" id="restockFees" step="0.01" min="0" value="0" placeholder="0.00" />
        </label>
        <div class="form-error" id="restockFormError"></div>
        <button type="submit" class="btn" style="width:100%; justify-content:center;">Confirm Restock</button>
      </form>
    </div>
  </div>

  <!-- Add Operational Fee Overlay (NEW) -->
  <div class="overlay" id="expenseOverlay" onclick="if(event.target===this) closeExpenseForm()">
    <div class="sheet">
      <div class="sheet-head">
        <div class="sheet-title" id="expenseSheetTitle">Add Operational Fee</div>
        <button class="close-btn" onclick="closeExpenseForm()">✕</button>
      </div>
      <form id="expenseForm" onsubmit="submitExpense(event)">
        <input type="hidden" id="expenseItemId" />
        <label class="field">Fee / Expense Amount (₱)
          <input type="number" id="expenseAmount" step="0.01" min="0.01" placeholder="e.g. 350.00 (moving/handling)" required />
        </label>
        <label class="field">Expense Note / Description
          <input type="text" id="expenseNote" placeholder="e.g. Manpower fee for transferring location" />
        </label>
        <div class="form-error" id="expenseFormError"></div>
        <button type="submit" class="btn" style="width:100%; justify-content:center; background:var(--teal); color:#000;">Record Fee</button>
      </form>
    </div>
  </div>

  <!-- Record Sale Overlay -->
  <div class="overlay" id="saleOverlay" onclick="if(event.target===this) closeSaleForm()">
    <div class="sheet">
      <div class="sheet-head">
        <div class="sheet-title" id="saleSheetTitle">Record Sale</div>
        <button class="close-btn" onclick="closeSaleForm()">✕</button>
      </div>
      <form id="saleForm" onsubmit="submitSale(event)">
        <input type="hidden" id="saleItemId" />
        <label class="field">Units Sold
          <input type="number" id="saleQty" min="1" value="1" required />
        </label>
        <label class="field">Actual Sold Price Per Unit (₱)
          <input type="number" id="salePrice" step="0.01" min="0" required />
        </label>
        <div class="form-error" id="saleFormError"></div>
        <button type="submit" class="btn" style="width:100%; justify-content:center; background:var(--success); color:#fff;">Confirm Sale</button>
      </form>
    </div>
  </div>

  <!-- Detail History Modal -->
  <div class="overlay" id="detailOverlay" onclick="if(event.target===this) closeDetailForm()">
    <div class="sheet">
      <div class="sheet-head">
        <div class="sheet-title" id="detailSheetTitle">Item History</div>
        <button class="close-btn" onclick="closeDetailForm()">✕</button>
      </div>
      <div id="detailContent" style="font-size:0.85rem; color:var(--text-muted); display:flex; flex-direction:column; gap:8px;">
        <!-- Filled dynamically -->
      </div>
    </div>
  </div>

  <script>
    let isAuthorized = false;
    let items = [];

    const PASSWORD = 'Sadueste123';

    function toggleAuth() {
      if (!isAuthorized) {
        const pwd = prompt('Enter password to unlock editing:');
        if (pwd === PASSWORD) {
          isAuthorized = true;
          document.getElementById('authBadge').textContent = '🔓 Unlocked (Full Access)';
          document.getElementById('authBadge').classList.add('active');
          document.getElementById('addItemBtn').disabled = false;
          document.getElementById('addItemBtn').style.opacity = '1';
          render();
        } else if (pwd !== null) {
          alert('Incorrect password.');
        }
      } else {
        isAuthorized = false;
        document.getElementById('authBadge').textContent = '🔒 Locked (Read-Only)';
        document.getElementById('authBadge').classList.remove('active');
        document.getElementById('addItemBtn').disabled = true;
        document.getElementById('addItemBtn').style.opacity = '0.5';
        render();
      }
    }

    function fmt(num) {
      return '₱' + Number(num || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    // API Calls
    async function loadData() {
      try {
        const res = await fetch('/api/inventory/items');
        if (res.ok) {
          items = await res.json();
        }
      } catch (err) {
        console.error('Failed to load data:', err);
      }
      render();
    }

    async function saveData() {
      if (!isAuthorized) return;
      try {
        await fetch('/api/inventory/items', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(items)
        });
      } catch (err) {
        console.error('Failed to save data:', err);
      }
    }

    // Render Logic
    function render() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const listEl = document.getElementById('itemList');
      
      const filtered = items.filter(i => 
        (i.name && i.name.toLowerCase().includes(search)) || 
        (i.sku && i.sku.toLowerCase().includes(search))
      );

      // Calculate Stats
      let totalCapital = 0;
      let totalSalesRev = 0;
      let totalFeesPaid = 0;

      items.forEach(i => {
        const qty = parseInt(i.quantity) || 0;
        const totalHistCost = parseFloat(i.totalHistoricalCost) || (qty * ((parseFloat(i.costPrice) || 0) + (parseFloat(i.additionalFees) || 0)));
        const totalHistFees = parseFloat(i.totalHistoricalAddFees) || (qty * (parseFloat(i.additionalFees) || 0));
        
        totalCapital += totalHistCost;
        totalFeesPaid += totalHistFees;

        if (i.sales && Array.isArray(i.sales)) {
          i.sales.forEach(s => {
            totalSalesRev += (s.qty * s.price);
          });
        }
      });

      const estimatedNetProfit = totalSalesRev - (totalCapital * (totalSalesRev > 0 ? 0.6 : 0)); // simple profit estimate framework or based on margins

      document.getElementById('statTotalCapital').textContent = fmt(totalCapital);
      document.getElementById('statTotalSales').textContent = fmt(totalSalesRev);
      document.getElementById('statNetProfit').textContent = fmt(estimatedNetProfit);
      document.getElementById('statTotalFees').textContent = fmt(totalFeesPaid);

      if (filtered.length === 0) {
        listEl.innerHTML = `<div class="empty-state">No products found.</div>`;
        return;
      }

      let html = '';
      filtered.forEach(item => {
        const qty = parseInt(item.quantity) || 0;
        const costPrice = parseFloat(item.costPrice) || 0;
        const addFees = parseFloat(item.additionalFees) || 0;
        const sellPrice = parseFloat(item.sellingPrice) || 0;
        
        const totalItemCost = parseFloat(item.totalHistoricalCost) || (qty * (costPrice + addFees));
        const totalItemAddFees = parseFloat(item.totalHistoricalAddFees) || (qty * addFees);
        const totalCostPerUnit = qty > 0 ? (totalItemCost / qty) : (costPrice + addFees);

        let soldCount = 0;
        if (item.sales && Array.isArray(item.sales)) {
          item.sales.forEach(s => soldCount += s.qty);
        }

        html += `
          <div class="item-card">
            <div class="item-header">
              <div>
                <div class="item-title">${item.name}</div>
                <div class="item-sku">SKU: ${item.sku || 'N/A'} | Stock: <strong>${qty}</strong> units</div>
              </div>
              <div style="text-align:right;">
                <div style="font-size:0.75rem; color:var(--text-muted);">Target Price</div>
                <div style="font-weight:700; color:var(--success);">${fmt(sellPrice)}</div>
              </div>
            </div>

            <div class="financial-grid">
              <div>
                <div class="fin-label">Total Cost</div>
                <div class="fin-val">${fmt(totalItemCost)}</div>
              </div>
              <div>
                <div class="fin-label">Add. Fees (Total)</div>
                <div class="fin-val" style="color:var(--teal);">${fmt(totalItemAddFees)}</div>
              </div>
              <div>
                <div class="fin-label">Avg. Cost / Unit</div>
                <div class="fin-val" style="color:var(--primary);">${fmt(totalCostPerUnit)}</div>
              </div>
              <div>
                <div class="fin-label">Units Sold</div>
                <div class="fin-val"><button class="link-btn" style="border:none; padding:0; color:var(--primary);" onclick="openDetail('${item.id}')">${soldCount} sold 📊</button></div>
              </div>
            </div>

            <div class="action-group">
              <button class="link-btn sell" onclick="openSaleForm('${item.id}')" ${!isAuthorized ? 'disabled style="opacity:0.5;"' : ''}>🛒 Record Sale</button>
              <button class="link-btn restock" onclick="openRestockForm('${item.id}')" ${!isAuthorized ? 'disabled style="opacity:0.5;"' : ''}>+ Restock</button>
              <button class="link-btn expense" onclick="openExpenseForm('${item.id}')" ${!isAuthorized ? 'disabled style="opacity:0.5;"' : ''}>💸 + Add Fee</button>
              <button class="link-btn delete" onclick="deleteItem('${item.id}')" ${!isAuthorized ? 'disabled style="opacity:0.5;"' : ''}>Delete</button>
            </div>
          </div>
        `;
      });

      listEl.innerHTML = html;
    }

    // Modal Controls: Add/Edit Product
    function openItemForm() {
      if (!isAuthorized) return;
      document.getElementById('editItemId').value = '';
      document.getElementById('itemSheetTitle').textContent = 'Add New Product';
      document.getElementById('itemName').value = '';
      document.getElementById('itemSku').value = '';
      document.getElementById('itemQty').value = '1';
      document.getElementById('itemCost').value = '';
      document.getElementById('itemPrice').value = '';
      document.getElementById('itemAddFees').value = '0';
      document.getElementById('itemFormError').textContent = '';
      document.getElementById('itemOverlay').classList.add('open');
    }
    function closeItemForm() { document.getElementById('itemOverlay').classList.remove('open'); }

    function submitItemForm(e) {
      e.preventDefault();
      if (!isAuthorized) return;

      const name = document.getElementById('itemName').value.trim();
      const sku = document.getElementById('itemSku').value.trim();
      const qty = parseInt(document.getElementById('itemQty').value) || 0;
      const cost = parseFloat(document.getElementById('itemCost').value) || 0;
      const price = parseFloat(document.getElementById('itemPrice').value) || 0;
      const addFees = parseFloat(document.getElementById('itemAddFees').value) || 0;

      const totalHistCost = (qty * cost) + addFees;

      const newItem = {
        id: 'item_' + Date.now(),
        name,
        sku,
        quantity: qty,
        costPrice: cost,
        sellingPrice: price,
        additionalFees: 0,
        totalHistoricalCost: totalHistCost,
        totalHistoricalAddFees: addFees,
        sales: [],
        expenses: []
      };

      items.push(newItem);
      closeItemForm();
      render();
      saveData();
    }

    // Modal Controls: Restock
    function openRestockForm(id) {
      if (!isAuthorized) return;
      const item = items.find(i => i.id === id);
      if (!item) return;

      document.getElementById('restockItemId').value = id;
      document.getElementById('restockSheetTitle').textContent = `Restock — ${item.name}`;
      document.getElementById('restockQty').value = '1';
      document.getElementById('restockCost').value = '';
      document.getElementById('restockFees').value = '0';
      document.getElementById('restockFormError').textContent = '';
      document.getElementById('restockOverlay').classList.add('open');
    }
    function closeRestockForm() { document.getElementById('restockOverlay').classList.remove('open'); }

    function submitRestock(e) {
      e.preventDefault();
      if (!isAuthorized) return;

      const id = document.getElementById('restockItemId').value;
      const addQty = parseInt(document.getElementById('restockQty').value) || 0;
      const batchCost = parseFloat(document.getElementById('restockCost').value) || 0;
      const batchFees = parseFloat(document.getElementById('restockFees').value) || 0;

      items = items.map(i => {
        if (i.id === id) {
          const oldQty = parseInt(i.quantity) || 0;
          const newQty = oldQty + addQty;
          
          const prevTotalCost = parseFloat(i.totalHistoricalCost) || (oldQty * ((parseFloat(i.costPrice) || 0) + (parseFloat(i.additionalFees) || 0)));
          const prevTotalFees = parseFloat(i.totalHistoricalAddFees) || (oldQty * (parseFloat(i.additionalFees) || 0));

          const newTotalCost = prevTotalCost + batchCost + batchFees;
          const newTotalFees = prevTotalFees + batchFees;
          const blendedUnitCost = newQty > 0 ? (newTotalCost / newQty) : 0;

          return {
            ...i,
            quantity: newQty,
            costPrice: blendedUnitCost,
            additionalFees: 0,
            totalHistoricalCost: newTotalCost,
            totalHistoricalAddFees: newTotalFees
          };
        }
        return i;
      });

      closeRestockForm();
      render();
      saveData();
    }

    // Modal Controls: Operational Fee / Expense (NEW)
    function openExpenseForm(id) {
      if (!isAuthorized) return;
      const item = items.find(i => i.id === id);
      if (!item) return;

      document.getElementById('expenseItemId').value = id;
      document.getElementById('expenseSheetTitle').textContent = `Add Operational Fee — ${item.name}`;
      document.getElementById('expenseAmount').value = '';
      document.getElementById('expenseNote').value = '';
      document.getElementById('expenseFormError').textContent = '';
      document.getElementById('expenseOverlay').classList.add('open');
    }
    function closeExpenseForm() { document.getElementById('expenseOverlay').classList.remove('open'); }

    function submitExpense(e) {
      e.preventDefault();
      if (!isAuthorized) return;

      const id = document.getElementById('expenseItemId').value;
      const feeAmount = parseFloat(document.getElementById('expenseAmount').value);
      const note = document.getElementById('expenseNote').value.trim() || 'General operational fee';

      if (isNaN(feeAmount) || feeAmount <= 0) {
        document.getElementById('expenseFormError').textContent = 'Please enter a valid fee amount.';
        return;
      }

      items = items.map(i => {
        if (i.id === id) {
          const oldQty = parseInt(i.quantity) || 0;
          const prevTotalCost = parseFloat(i.totalHistoricalCost) || (oldQty * ((parseFloat(i.costPrice) || 0) + (parseFloat(i.additionalFees) || 0)));
          const prevTotalAddFees = parseFloat(i.totalHistoricalAddFees) || (oldQty * (parseFloat(i.additionalFees) || 0));

          const newTotalCost = prevTotalCost + feeAmount;
          const newTotalAddFees = prevTotalAddFees + feeAmount;

          let newCostPrice = parseFloat(i.costPrice) || 0;
          if (oldQty > 0) {
            newCostPrice = newTotalCost / oldQty;
          }

          const expenseLog = i.expenses || [];

          return {
            ...i,
            costPrice: newCostPrice,
            additionalFees: 0,
            totalHistoricalCost: newTotalCost,
            totalHistoricalAddFees: newTotalAddFees,
            expenses: [...expenseLog, { date: Date.now(), amount: feeAmount, note }]
          };
        }
        return i;
      });

      closeExpenseForm();
      render();
      saveData();
    }

    // Modal Controls: Record Sale
    function openSaleForm(id) {
      if (!isAuthorized) return;
      const item = items.find(i => i.id === id);
      if (!item) return;

      document.getElementById('saleItemId').value = id;
      document.getElementById('saleSheetTitle').textContent = `Record Sale — ${item.name}`;
      document.getElementById('saleQty').value = '1';
      document.getElementById('salePrice').value = item.sellingPrice || '';
      document.getElementById('saleFormError').textContent = '';
      document.getElementById('saleOverlay').classList.add('open');
    }
    function closeSaleForm() { document.getElementById('saleOverlay').classList.remove('open'); }

    function submitSale(e) {
      e.preventDefault();
      if (!isAuthorized) return;

      const id = document.getElementById('saleItemId').value;
      const saleQty = parseInt(document.getElementById('saleQty').value) || 0;
      const salePrice = parseFloat(document.getElementById('salePrice').value) || 0;

      let errorMsg = '';
      items = items.map(i => {
        if (i.id === id) {
          const currentQty = parseInt(i.quantity) || 0;
          if (saleQty > currentQty) {
            errorMsg = `Cannot sell ${saleQty} units. Only ${currentQty} left in stock.`;
            return i;
          }
          const newQty = currentQty - saleQty;
          const salesLog = i.sales || [];
          salesLog.push({ date: Date.now(), qty: saleQty, price: salePrice });

          return {
            ...i,
            quantity: newQty,
            sales: salesLog
          };
        }
        return i;
      });

      if (errorMsg) {
        document.getElementById('saleFormError').textContent = errorMsg;
        return;
      }

      closeSaleForm();
      render();
      saveData();
    }

    // Modal Controls: Detail / History
    function openDetail(id) {
      const item = items.find(i => i.id === id);
      if (!item) return;

      document.getElementById('detailSheetTitle').textContent = `Activity History — ${item.name}`;
      const contentEl = document.getElementById('detailContent');

      let html = `<div style="font-weight:600; color:var(--text); margin-bottom:4px;">Sales Records:</div>`;
      if (!item.sales || item.sales.length === 0) {
        html += `<div>No sales recorded yet.</div>`;
      } else {
        item.sales.forEach((s, idx) => {
          const dateStr = new Date(s.date).toLocaleDateString();
          html += `<div>${idx + 1}. Sold <strong>${s.qty} units</strong> at ${fmt(s.price)} each on ${dateStr}</div>`;
        });
      }

      html += `<div style="font-weight:600; color:var(--text); margin-top:12px; margin-bottom:4px;">Operational Fee Expenses:</div>`;
      if (!item.expenses || item.expenses.length === 0) {
        html += `<div>No standalone expenses recorded.</div>`;
      } else {
        item.expenses.forEach((ex, idx) => {
          const dateStr = new Date(ex.date).toLocaleDateString();
          html += `<div>${idx + 1}. Paid <strong>${fmt(ex.amount)}</strong> for "${ex.note}" on ${dateStr}</div>`;
        });
      }

      contentEl.innerHTML = html;
      document.getElementById('detailOverlay').classList.add('open');
    }
    function closeDetailForm() { document.getElementById('detailOverlay').classList.remove('open'); }

    function deleteItem(id) {
      if (!isAuthorized) return;
      if (confirm('Are you sure you want to delete this product?')) {
        items = items.filter(i => i.id !== id);
        render();
        saveData();
      }
    }

    // Initialize on load
    loadData();
  </script>
</body>
</html>
