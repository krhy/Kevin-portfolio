<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pickleball Committee Fund</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap');

  :root {
    --court: #1B4B4A;
    --court-light: #23615F;
    --court-line: #2E7A76;
    --chalk: #F5F3EA;
    --chalk-dim: #C7D9D6;
    --yellow: #DCEE4B;
    --clay: #D97A45;
    --ink: #101917;
    --muted: #5b6b68;
    --muted-2: #8a938f;
    --border: #E6E2D6;
    --good: #3E7D5C;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Work Sans', sans-serif;
    background: var(--court);
    color: var(--chalk);
    min-height: 100vh;
  }
  button { font-family: inherit; cursor: pointer; }
  input:focus { outline: 2px solid var(--court); outline-offset: 1px; }
  button:focus-visible { outline: 2px solid var(--chalk); outline-offset: 2px; }

  .header { padding: 28px 20px 20px; }
  .brand { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .brand span {
    font-family: 'Oswald', sans-serif; font-size: 13px; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--chalk-dim);
  }
  .balance {
    font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 52px;
    line-height: 1; margin: 6px 0 14px; color: var(--yellow);
  }
  .balance.negative { color: var(--clay); }
  .divider { border-top: 2px dashed var(--court-line); margin: 6px 0 16px; }
  .stats { display: flex; gap: 22px; flex-wrap: wrap; }
  .stat-value { font-family: 'IBM Plex Mono', monospace; font-size: 17px; font-weight: 600; }
  .stat-label { font-size: 11px; color: #9DB6B2; text-transform: uppercase; letter-spacing: 0.06em; }

  .ledger-panel {
    background: var(--chalk); border-radius: 20px 20px 0 0; min-height: 320px;
    padding: 20px 16px 110px; color: var(--ink);
  }
  .ledger-title {
    font-family: 'Oswald', sans-serif; font-size: 13px; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--muted); margin-bottom: 12px; padding: 0 4px;
  }
  .empty-state { text-align: center; padding: 48px 20px; color: var(--muted); }

  .entry-card {
    background: #fff; border-radius: 14px; padding: 14px 16px; margin-bottom: 10px;
    box-shadow: 0 1px 2px rgba(16,25,23,0.06); border: 1px solid var(--border);
  }
  .entry-top { display: flex; justify-content: space-between; align-items: flex-start; }
  .entry-meta { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); margin-bottom: 3px; }
  .entry-detail { font-size: 14.5px; }
  .entry-detail .muted { color: var(--muted-2); }
  .entry-right { text-align: right; margin-left: 10px; }
  .entry-delta { font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 15px; display: flex; align-items: center; gap: 3px; justify-content: flex-end; }
  .entry-delta.pos { color: var(--good); }
  .entry-delta.neg { color: var(--clay); }
  .entry-bal { font-size: 11px; color: var(--muted-2); margin-top: 2px; }
  .entry-actions { display: flex; gap: 14px; margin-top: 8px; padding-top: 8px; border-top: 1px solid #F0EDE2; }
  .link-btn { background: none; border: none; font-size: 12.5px; cursor: pointer; display: flex; align-items: center; gap: 4px; padding: 0; color: var(--muted); }
  .link-btn.danger { color: var(--clay); }

  .fab-row { position: fixed; bottom: 20px; left: 0; right: 0; display: flex; justify-content: center; gap: 10px; }
  .fab-primary, .fab-secondary {
    display: flex; align-items: center; gap: 6px; border: none; border-radius: 999px;
    padding: 13px 22px; font-weight: 600; font-size: 14.5px;
  }
  .fab-primary { background: var(--yellow); color: var(--ink); box-shadow: 0 4px 14px rgba(0,0,0,0.25); }
  .fab-secondary { background: var(--court-light); color: var(--chalk); border: 1px solid var(--court-line); padding: 13px 18px; }

  .overlay {
    position: fixed; inset: 0; background: rgba(16,25,23,0.45);
    display: none; align-items: flex-end; z-index: 10;
  }
  .overlay.open { display: flex; }
  .sheet {
    background: var(--chalk); color: var(--ink); width: 100%; border-radius: 20px 20px 0 0;
    padding: 18px 18px 24px; max-height: 85vh; overflow-y: auto;
  }
  .sheet-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .sheet-title { font-family: 'Oswald', sans-serif; font-size: 17px; text-transform: uppercase; letter-spacing: 0.04em; }
  .close-btn { background: none; border: none; color: var(--muted); }

  .type-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .type-tab {
    flex: 1; padding: 8px 0; border-radius: 10px; border: 1px solid #DDD8C9;
    background: transparent; color: var(--muted); font-weight: 600; font-size: 13px;
  }
  .type-tab.active { background: var(--court); color: var(--chalk); border-color: var(--court); }

  form { display: flex; flex-direction: column; gap: 12px; }
  label.field { display: flex; flex-direction: column; gap: 5px; font-size: 13px; color: var(--muted); }
  input[type="text"], input[type="number"], input[type="date"] {
    padding: 10px 12px; border-radius: 10px; border: 1px solid #DDD8C9; font-size: 15px;
    font-family: 'Work Sans', sans-serif; background: #fff; color: var(--ink); width: 100%;
  }
  .split-row { display: flex; gap: 8px; }
  .split-btn {
    padding: 0 12px; border-radius: 10px; border: 1px solid var(--court); background: transparent;
    color: var(--court); font-size: 12px; font-weight: 600; white-space: nowrap;
  }
  .preview-line { font-size: 13px; color: var(--muted); }
  .preview-line strong.pos { color: var(--good); }
  .preview-line strong.neg { color: var(--clay); }
  .form-error { color: var(--clay); font-size: 13px; font-weight: 600; }
  .submit-btn { width: 100%; justify-content: center; margin-top: 8px; }

  .status-banner {
    position: fixed; top: 10px; right: 12px; font-size: 11px; transition: opacity 0.3s;
  }
</style>
</head>
<body>

<div class="header">
  <div class="brand">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
      <ellipse cx="12" cy="9" rx="7" ry="8" fill="#DCEE4B" />
      <circle cx="9.5" cy="6.5" r="0.9" fill="#1B4B4A" /><circle cx="12.5" cy="5.5" r="0.9" fill="#1B4B4A" />
      <circle cx="15" cy="7" r="0.9" fill="#1B4B4A" /><circle cx="9" cy="9.5" r="0.9" fill="#1B4B4A" />
      <circle cx="12" cy="9" r="0.9" fill="#1B4B4A" /><circle cx="15" cy="9.5" r="0.9" fill="#1B4B4A" />
      <circle cx="10" cy="12" r="0.9" fill="#1B4B4A" /><circle cx="13" cy="12" r="0.9" fill="#1B4B4A" />
      <rect x="10.7" y="16" width="2.6" height="7" rx="1.3" fill="#DCEE4B" />
    </svg>
    <span>Committee Fund</span>
  </div>
  <div id="balance" class="balance">Loading…</div>
  <div class="divider"></div>
  <div class="stats">
    <div><div id="statSessions" class="stat-value">0</div><div class="stat-label">Sessions</div></div>
    <div><div id="statCollected" class="stat-value">$0</div><div class="stat-label">Collected</div></div>
    <div><div id="statSpent" class="stat-value">$0</div><div class="stat-label">Spent</div></div>
  </div>
</div>

<div class="ledger-panel">
  <div class="ledger-title">Ledger</div>
  <div id="ledger"></div>
</div>

<div class="fab-row" id="fabRow">
  <button class="fab-secondary" onclick="openForm('expense')">− Expense</button>
  <button class="fab-primary" onclick="openForm('session')">+ Booking</button>
</div>

<div class="overlay" id="overlay" onclick="if(event.target===this) closeForm()">
  <div class="sheet">
    <div class="sheet-head">
      <div class="sheet-title" id="sheetTitle">New booking</div>
      <button class="close-btn" onclick="closeForm()">✕</button>
    </div>
    <div class="type-tabs" id="typeTabs">
      <button type="button" class="type-tab active" id="tabSession" onclick="setFormType('session')">Booking</button>
      <button type="button" class="type-tab" id="tabExpense" onclick="setFormType('expense')">Expense</button>
    </div>
    <form id="entryForm" onsubmit="submitForm(event)">
      <label class="field">Date
        <input type="date" id="fDate" />
      </label>
      <label class="field">Added by
        <input type="text" id="fAddedBy" placeholder="e.g. Doreen" />
      </label>
      <label class="field" id="fNoteLabel">Court / note (optional)
        <input type="text" id="fNote" placeholder="e.g. Court 3, evening slot" />
      </label>

      <div id="sessionFields">
        <label class="field">Total court cost
          <input type="number" step="0.01" min="0" id="fCost" />
        </label>
        <label class="field">Number of players
          <input type="number" min="1" id="fPlayers" />
        </label>
        <label class="field">Charge per player
          <div class="split-row">
            <input type="number" step="0.01" min="0" id="fCharge" style="flex:1" />
            <button type="button" class="split-btn" onclick="splitEvenly()">Split evenly</button>
          </div>
        </label>
        <div class="preview-line" id="previewLine"></div>
      </div>

      <div id="expenseFields" style="display:none">
        <label class="field">Amount
          <input type="number" step="0.01" min="0" id="fAmount" />
        </label>
      </div>

      <div class="form-error" id="formError"></div>
      <button type="submit" class="fab-primary submit-btn" id="submitBtn">Add to ledger</button>
    </form>
  </div>
</div>

<div class="status-banner" id="statusBanner" style="opacity:0">Saving…</div>

<script>
const API_URL = '/api/pickleball/entries';

let entries = [];
let formType = 'session';
let editingId = null;
let confirmDeleteId = null;

function fmt(n) {
  const sign = n < 0 ? '-' : '';
  return sign + '$' + Math.abs(n).toFixed(2).replace(/\.00$/, '');
}
function fmtDate(d) {
  const dt = new Date(d + 'T00:00:00');
  return dt.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
}
function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}
function todayStr() {
  return new Date().toISOString().slice(0, 10);
}

async function loadEntries() {
  try {
    const res = await fetch(API_URL);
    if (!res.ok) throw new Error('load failed');
    entries = await res.json();
  } catch (e) {
    console.error('Failed to load ledger', e);
    entries = [];
  }
  render();
}

async function saveEntries() {
  showStatus('Saving…');
  try {
    const res = await fetch(API_URL, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(entries),
    });
    if (!res.ok) throw new Error('save failed');
  } catch (e) {
    console.error('Failed to save ledger', e);
    showStatus('Save failed — check connection', true);
    return;
  }
  hideStatus();
}

function showStatus(text, isError) {
  const el = document.getElementById('statusBanner');
  el.textContent = text;
  el.style.color = isError ? '#D97A45' : '#DCEE4B';
  el.style.opacity = '1';
}
function hideStatus() {
  const el = document.getElementById('statusBanner');
  setTimeout(() => { el.style.opacity = '0'; }, 600);
}

function chronological() {
  return [...entries].sort((a, b) => a.date.localeCompare(b.date) || a.createdAt - b.createdAt);
}

function render() {
  const chrono = chronological();
  let running = 0;
  const withBalance = chrono.map(e => { running += e.delta; return { ...e, balanceAfter: running }; }).reverse();

  const balance = running;
  const collected = entries.filter(e => e.type === 'session').reduce((s, e) => s + e.collected, 0);
  const spent = entries.filter(e => e.type === 'session').reduce((s, e) => s + e.cost, 0)
              + entries.filter(e => e.type === 'expense').reduce((s, e) => s + e.amount, 0);
  const sessions = entries.filter(e => e.type === 'session').length;

  const balEl = document.getElementById('balance');
  balEl.textContent = fmt(balance);
  balEl.className = 'balance' + (balance < 0 ? ' negative' : '');

  document.getElementById('statSessions').textContent = sessions;
  document.getElementById('statCollected').textContent = fmt(collected);
  document.getElementById('statSpent').textContent = fmt(spent);

  const ledgerEl = document.getElementById('ledger');
  if (withBalance.length === 0) {
    ledgerEl.innerHTML = `<div class="empty-state">No bookings logged yet.<br/><span style="font-size:13px">Tap + to add your first court booking.</span></div>`;
    return;
  }

  ledgerEl.innerHTML = withBalance.map(e => entryCardHtml(e)).join('');
}

function entryCardHtml(e) {
  const deltaClass = e.delta >= 0 ? 'pos' : 'neg';
  const arrow = e.delta >= 0 ? '▲' : '▼';
  const detail = e.type === 'session'
    ? `${e.players} × ${fmt(e.charge)} <span class="muted">= ${fmt(e.collected)} collected · court ${fmt(e.cost)}</span>`
    : `<span class="muted">Expense · ${fmt(e.amount)}</span>`;

  const actions = confirmDeleteId === e.id
    ? `<button class="link-btn danger" onclick="doDelete('${e.id}')">Confirm delete</button>
       <button class="link-btn" onclick="cancelDelete()">Cancel</button>`
    : `<button class="link-btn" onclick="openEdit('${e.id}')">✎ Edit</button>
       <button class="link-btn" onclick="askDelete('${e.id}')">🗑 Delete</button>`;

  return `
    <div class="entry-card">
      <div class="entry-top">
        <div style="flex:1; min-width:0">
          <div class="entry-meta">📅 ${fmtDate(e.date)} ${e.addedBy ? `<span class="muted">· added by ${escapeHtml(e.addedBy)}</span>` : ''} ${e.note ? `<span class="muted">· ${escapeHtml(e.note)}</span>` : ''}</div>
          <div class="entry-detail">${detail}</div>
        </div>
        <div class="entry-right">
          <div class="entry-delta ${deltaClass}">${arrow} ${fmt(e.delta)}</div>
          <div class="entry-bal">bal. ${fmt(e.balanceAfter)}</div>
        </div>
      </div>
      <div class="entry-actions">${actions}</div>
    </div>`;
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function askDelete(id) { confirmDeleteId = id; render(); }
function cancelDelete() { confirmDeleteId = null; render(); }
function doDelete(id) {
  entries = entries.filter(e => e.id !== id);
  confirmDeleteId = null;
  render();
  saveEntries();
}

function openForm(type) {
  formType = type;
  editingId = null;
  resetForm();
  setFormType(type);
  document.getElementById('sheetTitle').textContent = type === 'session' ? 'New booking' : 'New expense';
  document.getElementById('overlay').classList.add('open');
}

function openEdit(id) {
  const e = entries.find(x => x.id === id);
  if (!e) return;
  editingId = id;
  formType = e.type;
  setFormType(e.type, true);
  document.getElementById('fDate').value = e.date;
  document.getElementById('fAddedBy').value = e.addedBy || '';
  document.getElementById('fNote').value = e.note || '';
  if (e.type === 'session') {
    document.getElementById('fCost').value = e.cost;
    document.getElementById('fPlayers').value = e.players;
    document.getElementById('fCharge').value = e.charge;
  } else {
    document.getElementById('fAmount').value = e.amount;
  }
  document.getElementById('sheetTitle').textContent = 'Edit ' + (e.type === 'session' ? 'booking' : 'expense');
  document.getElementById('overlay').classList.add('open');
  updatePreview();
}

function closeForm() {
  document.getElementById('overlay').classList.remove('open');
}

function resetForm() {
  document.getElementById('fDate').value = todayStr();
  document.getElementById('fAddedBy').value = '';
  document.getElementById('fNote').value = '';
  document.getElementById('fCost').value = '';
  document.getElementById('fPlayers').value = '';
  document.getElementById('fCharge').value = '';
  document.getElementById('fAmount').value = '';
  document.getElementById('formError').textContent = '';
  document.getElementById('previewLine').textContent = '';
}

function setFormType(type, isEdit) {
  formType = type;
  document.getElementById('tabSession').classList.toggle('active', type === 'session');
  document.getElementById('tabExpense').classList.toggle('active', type === 'expense');
  document.getElementById('typeTabs').style.display = isEdit ? 'none' : 'flex';
  document.getElementById('sessionFields').style.display = type === 'session' ? 'block' : 'none';
  document.getElementById('expenseFields').style.display = type === 'expense' ? 'block' : 'none';
  document.getElementById('fNoteLabel').firstChild.textContent = type === 'session' ? 'Court / note (optional)' : 'What for';
  document.getElementById('submitBtn').textContent = editingId ? 'Save changes' : 'Add to ledger';
  document.getElementById('formError').textContent = '';
}

function splitEvenly() {
  const cost = parseFloat(document.getElementById('fCost').value);
  const players = parseInt(document.getElementById('fPlayers').value, 10);
  if (cost > 0 && players > 0) {
    document.getElementById('fCharge').value = (Math.ceil((cost / players) * 100) / 100).toFixed(2);
    updatePreview();
  }
}

['fCost', 'fPlayers', 'fCharge'].forEach(id => {
  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById(id).addEventListener('input', updatePreview);
  });
});

function updatePreview() {
  const cost = parseFloat(document.getElementById('fCost').value) || 0;
  const players = parseInt(document.getElementById('fPlayers').value, 10) || 0;
  const charge = parseFloat(document.getElementById('fCharge').value) || 0;
  const el = document.getElementById('previewLine');
  if (cost && players && charge) {
    const collected = players * charge;
    const delta = collected - cost;
    const cls = delta >= 0 ? 'pos' : 'neg';
    el.innerHTML = `Collects ${fmt(collected)}, court costs ${fmt(cost)} → <strong class="${cls}">${fmt(delta)} to fund</strong>`;
  } else {
    el.textContent = '';
  }
}

function submitForm(ev) {
  ev.preventDefault();
  const errEl = document.getElementById('formError');
  errEl.textContent = '';

  const date = document.getElementById('fDate').value;

  if (formType === 'session') {
    const cost = parseFloat(document.getElementById('fCost').value);
    const players = parseInt(document.getElementById('fPlayers').value, 10);
    const charge = parseFloat(document.getElementById('fCharge').value);
    if (!date) return errEl.textContent = 'Pick a date.';
    if (!(cost > 0)) return errEl.textContent = 'Enter a court cost greater than 0.';
    if (!(players > 0)) return errEl.textContent = 'Enter at least 1 player.';
    if (!(charge >= 0)) return errEl.textContent = 'Enter a charge per player (0 or more).';

    const note = document.getElementById('fNote').value.trim();
    const addedBy = document.getElementById('fAddedBy').value.trim();
    const collected = players * charge;
    const entry = {
      id: editingId || uid(),
      type: 'session',
      date, note, addedBy, cost, players, charge, collected,
      delta: collected - cost,
      createdAt: editingId ? entries.find(x => x.id === editingId).createdAt : Date.now(),
    };
    upsert(entry);
  } else {
    const amount = parseFloat(document.getElementById('fAmount').value);
    if (!date) return errEl.textContent = 'Pick a date.';
    if (!(amount > 0)) return errEl.textContent = 'Enter an amount greater than 0.';

    const note = document.getElementById('fNote').value.trim() || 'Expense';
    const addedBy = document.getElementById('fAddedBy').value.trim();
    const entry = {
      id: editingId || uid(),
      type: 'expense',
      date, note, addedBy, amount,
      delta: -amount,
      createdAt: editingId ? entries.find(x => x.id === editingId).createdAt : Date.now(),
    };
    upsert(entry);
  }
}

function upsert(entry) {
  if (editingId) {
    entries = entries.map(x => x.id === editingId ? entry : x);
  } else {
    entries = [...entries, entry];
  }
  closeForm();
  render();
  saveEntries();
}

loadEntries();
</script>
</body>
</html>
